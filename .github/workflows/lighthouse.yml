# Accesibilidad y rendimiento web (WCAG AA, RNF de interfaz) con Lighthouse CI.
name: Lighthouse

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
      BACKEND_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # la misma que Vercel (D-018)
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Arrancar Next.js en modo producción
        run: |
          pnpm start &
          npx --yes wait-on http://localhost:3000 --timeout 60000

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./frontend/lighthouserc.json
          urls: |
            http://localhost:3000/
          runs: 3                 # mediana de 3 ejecuciones, menos ruido
          uploadArtifacts: true   # informes HTML descargables
          temporaryPublicStorage: true
