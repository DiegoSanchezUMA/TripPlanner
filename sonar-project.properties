# SonarQube Cloud: comprueba estos dos valores en sonarcloud.io al importar el repo
sonar.organization=diegosanchezuma
sonar.projectKey=DiegoSanchezUMA_TripPlanner
sonar.projectName=TripPlanner

sonar.sources=frontend/src,backend/app
# Los tests viven solo en backend/tests y frontend/tests (unit, integration, e2e),
# nunca junto al código en src/: así sources y tests no se solapan.
sonar.tests=backend/tests,frontend/tests
sonar.exclusions=**/*.stories.tsx,**/node_modules/**,**/.next/**,shared/types/**,backend/app/db/migrations/**
# Sin lógica que probar (D-002): estilos de Vanilla Extract y el layout raíz de Next.
# Coincide con las exclusiones de cobertura de frontend/vitest.config.ts.
sonar.coverage.exclusions=**/*.css.ts,frontend/src/app/layout.tsx

# Cobertura (generada por los jobs backend y frontend)
sonar.python.version=3.13
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/junit.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# El job falla si no se supera el quality gate
sonar.qualitygate.wait=true
