[project]
name = "tripplanner-backend"
version = "0.1.0"
description = "Backend de TripPlanner: BFF FastAPI + sistema multiagente CrewAI"
requires-python = ">=3.13,<3.14" # D-014: CrewAI no admite 3.14
# Rangos y motivos de cada versión: docs/decisiones/decisiones.md (D-016, D-017).
# Las versiones exactas instaladas están en uv.lock.
dependencies = [
    "crewai[litellm]==1.15.23",
    "crewai-tools[mcp]==1.15.23",
    "pydantic>=2.12.5,<2.13",           # límite impuesto por CrewAI
    "fastapi>=0.142.2,<0.143",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.0.54,<2.1",
    "alembic>=1.20,<2",
    "psycopg[binary,pool]>=3.3.6,<3.4",
    "pgvector>=0.5,<0.6",
    # Knowledge de CrewAI en un Qdrant en memoria por ejecución (D-036). Mismo
    # rango que el extra crewai[qdrant], pero sin fastembed: se usa el embedder
    # del proyecto, no un modelo local.
    "qdrant-client>=1.14.3,<1.15",
    "ag-ui-protocol>=1.0,<2",
    "langfuse>=4.16,<5",
    "openinference-instrumentation-crewai>=1.1.20,<2",
    "pyjwt>=2.15,<3",
    "pwdlib[argon2]>=0.3.1,<0.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "httpx2>=2.13,<3",                  # cliente que usa el TestClient de Starlette 1.x
    "ruff==0.16.10",
    "pyright==1.1.414",
    # pip-audit no va aquí: choca con CrewAI (tomli-w). Se ejecuta con uvx (D-016).
]

[tool.uv]
required-version = ">=0.12,<0.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "ASYNC", "RUF", "TID251"]

# CrewAI instala chromadb (~=1.1.0, con avisos de seguridad sin parche), pero
# nuestro código no debe usarlo: D-036.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"chromadb".msg = "Prohibido (D-036): vectores del usuario en pgvector; knowledge en RunKnowledgeStorage (Qdrant por ejecución)"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert es la forma normal de comprobar en pytest

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["app", "tests"]
exclude = ["tests/load", "**/__pycache__"] # Locust se ejecuta con uvx, no está en el entorno
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/db/migrations/*"]
