# Compose base de desarrollo local. Arranca solo la capa de datos (Postgres+pgvector;
# sin Redis, ver D-012) — el backend se añade en un paso posterior una vez tenga código real.
# Uso: desde infra/docker/
#   docker compose --env-file ../env/.env up -d
#
# Producción (VM Oracle Cloud) usará un docker-compose.prod.yml aparte que añade
# Caddy como reverse proxy con HTTPS automático y no publica los puertos de
# Postgres al host (solo red interna) — ver docs/arquitectura-multiagente-crewai.md.

name: tripplanner  # nombre fijo del proyecto Compose: evita que volúmenes/redes se
                    # llamen "docker_..." (por el nombre de esta carpeta) y coliden
                    # con otros proyectos Compose que tengas en la misma máquina.

services:
  postgres:
    # Imagen oficial del proyecto pgvector: ya trae la extensión compilada para
    # Postgres 16, no hace falta Dockerfile propio. Etiqueta fijada (pgvector 0.8.7,
    # Debian bookworm) en vez de la flotante "pg16"; se actualiza a mano (D-015).
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    container_name: tripplanner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tripplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en infra/env/.env}
      POSTGRES_DB: ${POSTGRES_DB:-tripplanner}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro   # scripts de arranque (solo la 1ª vez)
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # solo localhost, ni siquiera en la LAN
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tripplanner} -d ${POSTGRES_DB:-tripplanner}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
